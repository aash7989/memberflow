[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memberflow"
version = "0.2.0"
description = "Simulation-based staffing analysis for recreation member services"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3"]

[tool.setuptools.packages.find]
include = ["memberflow*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
